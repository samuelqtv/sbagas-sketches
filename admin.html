<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Navalha & Arte — Painel v3</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0c;--t:#e8e2d9;--m:rgba(232,226,217,0.42);--mm:rgba(232,226,217,0.25);--b:rgba(232,226,217,0.07);--bl:rgba(232,226,217,0.14);--h:rgba(232,226,217,0.04);--g:#C4A44A;--gg:#4CAF50;--d:'Cormorant Garamond',serif;--f:'Inter',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--t);font-family:var(--f);font-weight:300;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
input,select,button,textarea{font-family:var(--f)}
/* ── LOGIN ── */
.login-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999}
.login-card{border:1px solid var(--b);padding:48px;max-width:440px;width:100%}
.login-title{font-family:var(--d);font-size:2rem;font-weight:300;margin-bottom:4px;letter-spacing:0.04em}
.login-sub{font-size:0.62rem;color:var(--m);margin-bottom:28px;letter-spacing:0.12em;text-transform:uppercase}
.role-tabs{display:flex;gap:0;margin-bottom:24px;border:1px solid var(--b)}
.role-tab{flex:1;text-align:center;padding:10px 4px;font-size:0.52rem;letter-spacing:0.18em;text-transform:uppercase;cursor:pointer;color:var(--mm);transition:all .3s;background:none;border:none;border-right:1px solid var(--b);font-family:var(--f)}
.role-tab:last-child{border-right:none}.role-tab.active{color:var(--t);background:var(--h)}
.login-field{margin-bottom:18px}.login-field label{display:block;font-size:0.52rem;letter-spacing:0.28em;text-transform:uppercase;color:rgba(232,226,217,0.28);margin-bottom:5px}
.login-field input,.login-field select{width:100%;padding:11px 14px;background:rgba(232,226,217,0.03);border:1px solid var(--b);color:var(--t);font-size:0.76rem;font-weight:300}
.login-field input:focus{outline:0;border-color:rgba(232,226,217,0.25)}
.login-btn{width:100%;padding:12px;border:1px solid var(--t);background:var(--t);color:var(--bg);font-size:0.6rem;letter-spacing:0.22em;text-transform:uppercase;cursor:pointer;font-weight:400;margin-top:4px;transition:all .3s}.login-btn:hover{opacity:0.88}
.social-login{display:flex;gap:10px;margin-top:16px}
.social-btn{flex:1;padding:10px;border:1px solid var(--bl);background:none;color:var(--t);font-size:0.55rem;letter-spacing:0.1em;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center;gap:6px}.social-btn:hover{background:var(--h);border-color:var(--t)}
/* ── LAYOUT ── */
.shell{display:flex;min-height:100vh}
.sidebar{width:220px;border-right:1px solid var(--b);padding:24px 20px;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:10;background:var(--bg)}
.side-logo{font-family:var(--d);font-size:1.3rem;font-weight:400;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:4px}
.side-logo span{display:block;font-family:var(--f);font-size:0.48rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--m);margin-top:1px}
.side-nav{flex:1;margin-top:36px;overflow-y:auto}
.side-link{display:block;padding:8px 12px;font-size:0.58rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--m);text-decoration:none;border-left:1px solid transparent;margin-bottom:1px;transition:all .3s}
.side-link:hover,.side-link.active{color:var(--t);border-left-color:var(--t);background:var(--h)}
.side-badge{float:right;font-size:0.48rem;padding:1px 6px;border:1px solid var(--b);color:var(--m)}
.side-user{border-top:1px solid var(--b);padding-top:14px;font-size:0.56rem}
.side-user-name{font-weight:400}.side-user-role{color:var(--m);font-size:0.48rem;letter-spacing:0.12em;text-transform:uppercase}
.main{margin-left:220px;flex:1;padding:32px 40px;max-width:1100px}
/* ── PAGES ── */
.page{display:none}.page.active{display:block;animation:fade .3s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.page-title{font-family:var(--d);font-size:1.8rem;font-weight:300;margin-bottom:4px}
.page-sub{font-size:0.6rem;color:var(--m);letter-spacing:0.08em;margin-bottom:28px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.stat-card{border:1px solid var(--b);padding:20px 18px}
.stat-label{font-size:0.5rem;letter-spacing:0.22em;text-transform:uppercase;color:rgba(232,226,217,0.25);margin-bottom:6px}
.stat-value{font-family:var(--d);font-size:1.8rem;font-weight:300}
.stat-delta{font-size:0.52rem;color:var(--g);margin-top:2px}.stat-sub{font-size:0.5rem;color:var(--m);margin-top:2px}
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.chart-box{border:1px solid var(--b);padding:20px}
.chart-title{font-size:0.5rem;letter-spacing:0.22em;text-transform:uppercase;color:rgba(232,226,217,0.25);margin-bottom:14px}
.bar-group{display:flex;align-items:flex-end;gap:12px;height:100px;padding-top:8px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar{width:100%;transition:height .5s ease}.bar-label{font-size:0.48rem;color:var(--m);letter-spacing:0.08em}.bar-value{font-size:0.52rem;font-weight:400}
.table-wrap{border:1px solid var(--b)}
.table-row{display:grid;padding:13px 16px;border-bottom:1px solid var(--b);font-size:0.68rem;align-items:center;transition:background .3s}
.table-row:hover{background:var(--h)}.table-row:last-child{border-bottom:none}
.table-hd{font-size:0.5rem;letter-spacing:0.18em;text-transform:uppercase;color:rgba(232,226,217,0.25);background:rgba(232,226,217,0.02)}
.status-dot{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:5px}.s-on{background:#4CAF50}.s-off{background:rgba(232,226,217,0.12)}
.badge{display:inline-block;padding:3px 8px;border:1px solid var(--b);font-size:0.48rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--m)}
.badge-g{border-color:var(--g);color:var(--g)}.badge-r{border-color:#c0392b;color:#c0392b}.badge-gr{border-color:var(--gg);color:var(--gg)}
.btn-sm{padding:6px 14px;border:1px solid var(--bl);background:none;color:var(--t);font-size:0.53rem;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;transition:all .3s;font-family:var(--f)}
.btn-sm:hover{background:var(--h);border-color:var(--t)}.btn-sm.danger:hover{border-color:#c0392b;color:#c0392b}
.btn-add{padding:8px 20px;border:1px solid var(--bl);background:none;color:var(--t);font-size:0.56rem;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;transition:all .3s;margin-bottom:18px}
.btn-add:hover{background:var(--h);border-color:var(--t)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:200;align-items:center;justify-content:center}
.modal-overlay.on{display:flex}
.modal{background:var(--bg);border:1px solid var(--b);padding:32px;max-width:520px;width:90%;max-height:85vh;overflow-y:auto}
.modal-title{font-family:var(--d);font-size:1.35rem;font-weight:300;margin-bottom:20px}
.modal-field{margin-bottom:14px}.modal-field label{display:block;font-size:0.5rem;letter-spacing:0.22em;text-transform:uppercase;color:rgba(232,226,217,0.25);margin-bottom:4px}
.modal-field input,.modal-field select,.modal-field textarea{width:100%;padding:10px 12px;background:rgba(232,226,217,0.03);border:1px solid var(--b);color:var(--t);font-size:0.72rem;font-weight:300}
.modal-field input:focus,.modal-field select:focus,.modal-field textarea:focus{outline:0;border-color:rgba(232,226,217,0.25)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.check-group{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.check-item{display:flex;align-items:center;gap:6px;font-size:0.65rem;cursor:pointer;color:var(--m);padding:6px 12px;border:1px solid var(--b);transition:all .3s}
.check-item:hover{border-color:var(--bl)}.check-item.checked{border-color:var(--t);color:var(--t);background:var(--h)}.check-item input{display:none}
.plan-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.plan-card{border:1px solid var(--b);padding:24px 20px;transition:all .3s}
.plan-card:hover{border-color:var(--bl);background:var(--h)}.plan-card.active-plan{border-color:var(--g)}
.plan-nome{font-family:var(--d);font-size:1.15rem;font-weight:400;margin-bottom:2px}
.plan-svcs{font-size:0.52rem;color:var(--m);letter-spacing:0.08em;margin-bottom:10px}
.plan-preco{font-family:var(--d);font-size:1.4rem;font-weight:300;color:var(--g)}.plan-periodo{font-size:0.5rem;color:var(--m)}
.plan-btn{margin-top:12px;display:block;text-align:center;padding:9px;border:1px solid var(--bl);color:var(--t);text-decoration:none;font-size:0.52rem;letter-spacing:0.12em;text-transform:uppercase;transition:all .3s;cursor:pointer;font-family:var(--f);background:none;width:100%}
.plan-btn:hover{background:var(--t);color:var(--bg);border-color:var(--t)}.plan-btn.active-plan-btn{background:var(--g);border-color:var(--g);color:#fff}
/* KPI card highlight */
.kpi-highlight{border-color:var(--gg)}
@media(max-width:768px){
  .shell{flex-direction:column}.sidebar{position:relative;width:100%;flex-direction:row;flex-wrap:wrap;padding:10px 14px}.side-nav{display:none}.main{margin-left:0;padding:18px 14px}
  .stats-grid{grid-template-columns:repeat(2,1fr)}.plan-grid{grid-template-columns:1fr}.charts-row{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ═══════════ LOGIN ═══════════ -->
<div class="login-overlay" id="loginScreen">
  <div class="login-card">
    <div class="login-title">Navalha & Arte</div><div class="login-sub">Painel administrativo</div>
    <div class="role-tabs" id="roleTabs">
      <button class="role-tab active" data-role="OWNER">Dono</button>
      <button class="role-tab" data-role="BARBER">Barbeiro</button>
      <button class="role-tab" data-role="CLIENT">Cliente</button>
    </div>
    <div class="login-field"><label>Email</label><input type="email" id="loginEmail" value="dono@navalha.com"></div>
    <div class="login-field"><label>Senha</label><input type="password" id="loginPass" value="••••••"></div>
    <button class="login-btn" onclick="doLogin()">Entrar</button>
    <div style="margin-top:18px;border-top:1px solid var(--b);padding-top:16px">
      <p style="font-size:0.48rem;color:var(--mm);letter-spacing:0.1em;text-align:center;margin-bottom:10px;text-transform:uppercase">Ou entre com</p>
      <div class="social-login"><button class="social-btn" onclick="doLogin()">🍎 Apple</button><button class="social-btn" onclick="doLogin()">🔵 Google</button></div>
    </div>
  </div>
</div>

<!-- ═══════════ SHELL ═══════════ -->
<div class="shell" id="appShell" style="display:none">
  <aside class="sidebar"><div class="side-logo">Navalha <span>painel</span></div><nav class="side-nav" id="sideNav"></nav>
    <div class="side-user"><div class="side-user-name" id="sideUserName">—</div><div class="side-user-role" id="sideUserRole">—</div>
      <a href="#" onclick="logout()" style="font-size:0.46rem;color:var(--m);text-decoration:none;margin-top:6px;display:inline-block">Sair</a>
    </div>
  </aside>
  <main class="main" id="mainContent"></main>
</div>
<div class="modal-overlay" id="modal"><div class="modal" id="modalBody"></div></div>

<script>
// ════════════ STATE ════════════
let role='OWNER',actPage='dashboard';
const services=[{id:1,n:'Corte Premium',p:85,d:45},{id:2,n:'Barba Completa',p:65,d:30},{id:3,n:'Combo Navalha',p:130,d:60},{id:4,n:'Hidratação',p:95,d:40}];
const barbers=[{id:1,n:'Ricardo',t:'Corte',a:true},{id:2,n:'Felipe',t:'Barba',a:true},{id:3,n:'André',t:'Estilo',a:true}];
let combos=[{id:1,nome:'Essencial',svcs:[1],preco:79,qtd:1,per:'mês',desc:'1 corte por mês'},{id:2,nome:'Premium',svcs:[1,2,4],preco:139,qtd:2,per:'mês',desc:'2 agendamentos/mês'},{id:3,nome:'Elite',svcs:[1,2,3,4],preco:249,qtd:4,per:'mês',desc:'4 agendamentos/mês'},{id:4,nome:'Ilimitado',svcs:[1,2,3,4],preco:399,qtd:-1,per:'mês',desc:'Sem limites'}];
let coupons=[{id:1,cod:'NAVALHA20',tipo:'percentual',valor:20,validade:'2026-12-31',maxUsos:100,usado:34,ativo:true},{id:2,cod:'BOASVINDAS',tipo:'fixo',valor:30,validade:'2026-09-30',maxUsos:50,usado:12,ativo:true}];

// Barber split data (per barber)
let barberGates2b={key:'g2b_sk_barber_ricardo_••••',split:70,status:'active'};
let barberFinance={atendimentos:112,receitaSplit:'R$ 6.830',receitaBruta:'R$ 9.760',splitPct:70,comissaoShop:'30% (R$ 2.930)',proximoRepasse:'15/09'};

// ════════════ AUTH ════════════
document.querySelectorAll('.role-tab').forEach(b=>b.onclick=function(){
  document.querySelectorAll('.role-tab').forEach(x=>x.classList.remove('active'));this.classList.add('active');role=this.dataset.role;
  document.getElementById('loginEmail').value=['OWNER','BARBER'].includes(role)?'dono@navalha.com':'cliente@email.com';
});
function doLogin(){document.getElementById('loginScreen').style.display='none';document.getElementById('appShell').style.display='flex';buildSidebar();navigate(role==='BARBER'?'meu-dash':'dashboard');}
function logout(){document.getElementById('loginScreen').style.display='flex';document.getElementById('appShell').style.display='none';actPage='dashboard';}
function buildSidebar(){
  const u=document.getElementById('sideUserName'),r=document.getElementById('sideUserRole'),nav=document.getElementById('sideNav');
  if(role==='OWNER'){u.textContent='Carlos Silva';r.textContent='Dono';nav.innerHTML=`
<a href="#" class="side-link active" data-page="dashboard" onclick="navigate('dashboard');return false">Dashboard v2</a>
<a href="#" class="side-link" data-page="agenda" onclick="navigate('agenda');return false">Agenda</a>
<a href="#" class="side-link" data-page="barbeiros" onclick="navigate('barbeiros');return false">Barbeiros</a>
<a href="#" class="side-link" data-page="servicos" onclick="navigate('servicos');return false">Serviços</a>
<a href="#" class="side-link" data-page="combos-admin" onclick="navigate('combos-admin');return false">Combos <span class="side-badge">${combos.length}</span></a>
<a href="#" class="side-link" data-page="cupons" onclick="navigate('cupons');return false">Cupons <span class="side-badge">${coupons.length}</span></a>
<a href="#" class="side-link" data-page="config" onclick="navigate('config');return false">Configurações</a>`;}
  else if(role==='BARBER'){u.textContent='Ricardo Moura';r.textContent='Barbeiro';nav.innerHTML=`
<a href="#" class="side-link active" data-page="meu-dash" onclick="navigate('meu-dash');return false">Meu Painel</a>
<a href="#" class="side-link" data-page="minha-agenda" onclick="navigate('minha-agenda');return false">Minha Agenda</a>
<a href="#" class="side-link" data-page="meus-horarios" onclick="navigate('meus-horarios');return false">Meus Horários</a>
<a href="#" class="side-link" data-page="meu-split" onclick="navigate('meu-split');return false">Financeiro</a>
<a href="#" class="side-link" data-page="meus-dados-bancarios" onclick="navigate('meus-dados-bancarios');return false">Dados Bancários</a>`;}
  else{u.textContent='João Cliente';r.textContent='Cliente';nav.innerHTML=`
<a href="#" class="side-link active" data-page="cliente-inicio" onclick="navigate('cliente-inicio');return false">Início</a>
<a href="#" class="side-link" data-page="agendar-rapido" onclick="navigate('agendar-rapido');return false">Agendar</a>
<a href="#" class="side-link" data-page="meus-agendamentos" onclick="navigate('meus-agendamentos');return false">Histórico</a>
<a href="#" class="side-link" data-page="cliente-pagamentos" onclick="navigate('cliente-pagamentos');return false">Pagamentos</a>
<a href="#" class="side-link" data-page="meu-perfil" onclick="navigate('meu-perfil');return false">Meu Perfil</a>`;}
}
function navigate(page){
  actPage=page;document.querySelectorAll('.side-link').forEach(l=>l.classList.toggle('active',l.dataset.page===page));
  document.getElementById('mainContent').innerHTML=(RENDER[page]||RENDER.default)();
}
// ════════════ RENDER HUB ════════════
const RENDER={};

// ─── BARBER: MEU PAINEL (split view) ───
RENDER['meu-dash']=()=>`<div class="page active">
<div class="page-title">Meu Painel</div><div class="page-sub">Bem-vindo, Ricardo · Split: <b style="color:var(--gg)">${barberFinance.splitPct}%</b> · Próx. repasse: ${barberFinance.proximoRepasse}</div>
<div class="stats-grid">
  <div class="stat-card kpi-highlight"><div class="stat-label">Minha Receita (Split)</div><div class="stat-value">R$ 6.830</div><div class="stat-sub">${barberFinance.splitPct}% do total de R$ 9.760</div></div>
  <div class="stat-card"><div class="stat-label">Atendimentos</div><div class="stat-value">${barberFinance.atendimentos}</div><div class="stat-sub">este mês</div></div>
  <div class="stat-card"><div class="stat-label">Ticket Médio</div><div class="stat-value">R$ 87</div><div class="stat-sub">por atendimento</div></div>
  <div class="stat-card"><div class="stat-label">Comissão Shop</div><div class="stat-value">R$ 2.930</div><div class="stat-sub">${100-barberFinance.splitPct}% — retido pela barbearia</div></div>
</div>
<div class="charts-row">
  <div class="chart-box"><div class="chart-title">Minha Receita: Split vs Shop</div>
    <div class="bar-group">
      <div class="bar-col"><div class="bar-value">R$ 6.830</div><div class="bar" style="height:72px;background:var(--gg)"></div><div class="bar-label">Meu split (70%)</div></div>
      <div class="bar-col"><div class="bar-value">R$ 2.930</div><div class="bar" style="height:30px;background:var(--mm)"></div><div class="bar-label">Shop (30%)</div></div>
    </div></div>
  <div class="chart-box"><div class="chart-title">Evolução mensal</div>
    <div class="bar-group" style="justify-content:space-between">
      ${[{m:'Mai',v:'5.2'},{m:'Jun',v:'5.8'},{m:'Jul',v:'6.1'},{m:'Ago',v:'6.8'}].map(d=>`<div class="bar-col"><div class="bar-value">R$ ${d.v}k</div><div class="bar" style="height:${parseFloat(d.v)*10}px;background:var(--gg)"></div><div class="bar-label">${d.m}</div></div>`).join('')}
    </div></div>
</div>
<div class="table-wrap"><div class="table-row table-hd" style="grid-template-columns:100px 1fr 100px 100px 90px"><span>Data</span><span>Serviço</span><span>Valor Total</span><span>Meu Split</span><span></span></div>
${[
  {d:'14/09 10:00',s:'Corte Premium',t:'85',sp:'59,50'},{d:'14/09 13:00',s:'Hidratação',t:'95',sp:'66,50'},{d:'13/09 09:00',s:'Combo Navalha',t:'130',sp:'91,00'},{d:'13/09 14:30',s:'Barba Completa',t:'65',sp:'45,50'},{d:'12/09 11:00',s:'Corte Premium',t:'85',sp:'59,50'},
].map(r=>`<div class="table-row" style="grid-template-columns:100px 1fr 100px 100px 90px"><span>${r.d}</span><span>${r.s}</span><span>R$ ${r.t}</span><span style="color:var(--gg);font-weight:400">R$ ${r.sp}</span><span><span class="badge badge-gr">Split</span></span></div>`).join('')}
</div><p style="font-size:0.48rem;color:var(--mm);margin-top:8px">O split é automático via Gates2B — o valor já cai na sua conta a cada pagamento confirmado.</p></div>`;

// ─── BARBER: MINHA AGENDA ───
RENDER['minha-agenda']=()=>`<div class="page active"><div class="page-title">Minha Agenda</div><div class="page-sub">14 Setembro 2026 · Ricardo Moura</div>
<div class="table-wrap"><div class="table-row table-hd" style="grid-template-columns:90px 120px 1fr 80px 80px"><span>Hora</span><span>Cliente</span><span>Serviço</span><span>Valor</span><span></span></div>
${[{h:'09:00',c:'Lucas M.',s:'Corte Premium',v:'85'},{h:'10:00',c:'—',s:'Disponível',v:'—'},{h:'11:15',c:'—',s:'Disponível',v:'—'},{h:'13:00',c:'Gabriel S.',s:'Combo Navalha',v:'130'},{h:'14:30',c:'Rafael C.',s:'Corte Premium',v:'85'},{h:'16:00',c:'—',s:'Disponível',v:'—'}].map(r=>`<div class="table-row" style="grid-template-columns:90px 120px 1fr 80px 80px"><span>${r.h}</span><span style="color:${r.c==='—'?'var(--m)':'var(--t)'}">${r.c}</span><span style="color:${r.c==='—'?'var(--m)':'var(--t)'}">${r.s}</span><span>${r.v==='—'?'—':'R$ '+r.v}</span><span>${r.c==='—'?'<button class="btn-sm">Bloquear</button>':'<button class="btn-sm danger">Cancelar</button>'}</span></div>`).join('')}
</div></div>`;

// ─── BARBER: FINANCEIRO / SPLIT ───

// ════════════ MODAL ════════════
function showModal(type){
  document.getElementById('modal').classList.add('on');
  const b=document.getElementById('modalBody');
  if(type==='barber') b.innerHTML=`<div class="modal-title">Novo Barbeiro</div><div class="modal-field"><label>Nome</label><input></div><div class="modal-field"><label>Especialidade</label><input></div><div class="modal-field"><label>Split (%)</label><input type="number" value="70"></div><div class="modal-actions"><button class="btn-sm" onclick="closeModal()">Cancelar</button><button class="btn-sm" style="background:var(--t);color:var(--bg);border-color:var(--t)">Salvar</button></div>`;
  else if(type==='svc') b.innerHTML=`<div class="modal-title">Novo Serviço</div><div class="modal-field"><label>Nome</label><input></div><div class="modal-field"><label>Preço (R$)</label><input type="number"></div><div class="modal-field"><label>Duração (min)</label><input type="number"></div><div class="modal-actions"><button class="btn-sm" onclick="closeModal()">Cancelar</button><button class="btn-sm" style="background:var(--t);color:var(--bg);border-color:var(--t)">Salvar</button></div>`;
  else if(type==='combo') b.innerHTML=`<div class="modal-title">Novo Combo</div><div class="modal-field"><label>Nome</label><input></div><div class="modal-field"><label>Serviços incluídos</label><div class="check-group">${services.map(s=>`<label class="check-item" onclick="this.classList.toggle('checked')"><input type="checkbox">${s.n}</label>`).join('')}</div></div><div class="modal-field"><label>Agendamentos / período</label><input type="number" placeholder="2"></div><div class="modal-field"><label>Período</label><select><option>mês</option><option>semana</option></select></div><div class="modal-field"><label>Preço (R$)</label><input type="number" placeholder="139"></div><div class="modal-field"><label>Descrição</label><textarea rows="2"></textarea></div><div class="modal-actions"><button class="btn-sm" onclick="closeModal()">Cancelar</button><button class="btn-sm" style="background:var(--t);color:var(--bg);border-color:var(--t)">Salvar</button></div>`;
  else if(type==='coupon') b.innerHTML=`<div class="modal-title">Novo Cupom</div><div class="modal-field"><label>Código</label><input placeholder="PROMO20"></div><div class="modal-field"><label>Tipo</label><select><option>percentual</option><option>fixo</option></select></div><div class="modal-field"><label>Valor</label><input type="number" placeholder="20"></div><div class="modal-field"><label>Validade</label><input type="date" value="2026-12-31"></div><div class="modal-field"><label>Máximo de usos</label><input type="number" placeholder="100"></div><div class="modal-actions"><button class="btn-sm" onclick="closeModal()">Cancelar</button><button class="btn-sm" style="background:var(--t);color:var(--bg);border-color:var(--t)">Salvar</button></div>`;
}
function closeModal(){document.getElementById('modal').classList.remove('on')}
document.getElementById('modal').onclick=function(e){if(e.target===this)closeModal()};
</script>
